[workspace]
resolver = "3"
members = ["crates/oniko-core", "crates/oniko"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
oniko-core = { path = "crates/oniko-core" }
# gpui is pinned to the crates.io release; to follow the component library's gpui, point this at the same source.
gpui = "0.2.2"
agent-client-protocol = "5.0.0"
anyhow = "1.0.104"
dirs = "7.0.0"
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "process", "sync", "time", "macros", "io-util", "fs"] }
uuid = { version = "1.29.0", features = ["v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
